# /etc/nginx/sites-available/cam.savankong.com  (then symlink into sites-enabled)
# Get the certificate with:  sudo certbot --nginx -d cam.savankong.com
server {
    listen 80;
    server_name cam.savankong.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Live updates (server-sent events) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
