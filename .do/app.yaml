name: savankong-com
region: nyc

services:
  - name: web
    github:
      repo: savankong/savankong.com
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm run build
    run_command: npm run start
    http_port: 8080
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${savankong-db.DATABASE_URL}
      - key: NEXT_PUBLIC_ADMIN_PASSWORD
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      # home.savankong.com (see docs/home.md)
      - key: NEXT_PUBLIC_HOME_HOST
        scope: RUN_AND_BUILD_TIME
        value: home.savankong.com
      - key: HOME_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: HOME_SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: HOME_RETENTION_DAYS
        scope: RUN_TIME
        value: "30"
      - key: SPACES_REGION
        scope: RUN_TIME
        value: nyc3
      - key: SPACES_BUCKET
        scope: RUN_TIME
        value: kong-home
      - key: SPACES_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_SECRET
        scope: RUN_TIME
        type: SECRET

workers:
  # Listens for Ring motion and doorbell alerts, records each one and saves
  # it to Spaces. One instance only: two would record every event twice and
  # fight over Ring's rotating refresh token.
  - name: home-recorder
    github:
      repo: savankong/savankong.com
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: echo "No build step for the recorder"
    run_command: npm run home:recorder
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${savankong-db.DATABASE_URL}
      - key: RING_REFRESH_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: HOME_CLIP_SECONDS
        scope: RUN_TIME
        value: "30"
      - key: HOME_LIVE_SECONDS
        scope: RUN_TIME
        value: "120"
      - key: HOME_RETENTION_DAYS
        scope: RUN_TIME
        value: "30"
      - key: SPACES_REGION
        scope: RUN_TIME
        value: nyc3
      - key: SPACES_BUCKET
        scope: RUN_TIME
        value: kong-home
      - key: SPACES_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SPACES_SECRET
        scope: RUN_TIME
        type: SECRET

databases:
  - name: savankong-db
    engine: PG
    version: "16"
    production: true
